[package]
name = "xtask"
description = "Build orchestration for Conquer Ops: Rust core, patched engine, mod archive, dist folder."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zhbo-formats = { path = "../crates/zhbo-formats" }
zhbo-core = { path = "../crates/zhbo-core" }
# The dist keeps the player's converted BO2 archive while `zhbo_assets::hud`'s version check
# accepts it (`hud::archive_current`, the launcher's own test).
zhbo-assets = { path = "../crates/zhbo-assets" }
