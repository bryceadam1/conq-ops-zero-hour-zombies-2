; ConquerOps gameplay tuning. The same file must reach every player in a game (it ships in
; ConquerOps.big, like weapons.ini). The defaults in crates/zhbo-core/src/tuning.rs must equal
; this file (a test checks it).
;
; BO2's numbers are in BO2's units (inches, inches/s, seconds) under the engine's dvar names, with
; the engine defaults read from t6mp by Ghidra: ~/Documents/BO2-reference/ghidra/answers/G1-G7.md
; (every dvar: dvars-t6mp.tsv there). Keys match case-insensitively, ignoring _ and .

[Movement]
; G2
g_speed = 190
player_sprintTime = 4
player_sprintSpeedScale = 1.5
player_sprintStrafeSpeedScale = 0.667
player_backSpeedScale = 0.7
player_strafeSpeedScale = 0.8
player_sprintForwardMinimum = 105
player_sprintRechargePause = 0
; hard-coded in the engine (G2): sprint restart needs > 1 s, the meter caps at 16383 ms
SprintRestartMinimum = 1
SprintMax = 16.383
StanceCrouchScale = 0.65
StanceProneScale = 0.15
StanceProneDownTime = 0.6
StanceProneUpTime = 0.4
jump_height = 39
bg_gravity = 800
friction = 5.5
stopspeed = 100
jump_stepSize = 18

[Bullets]
; t6mp's bulletrange dvar (FUN_006e86b0): how far a non-spread round is traced, inches. Spread
; classes (shotguns, the Executioner) trace to their damage curve's last range instead.
bulletrange = 8192

[Perks]
; G1: each applies where its specialty is tested
perk_speedMultiplier = 1.07
perk_sprintMultiplier = 2
perk_sprintRecoveryMultiplier = 0.3
perk_mantleReduction = 0.4
perk_fastLadderClimbMultiplier = 1.75
perk_weapSwitchMultiplier = 0.5
perk_weapReloadMultiplier = 0.5
perk_weapRateMultiplier = 0.75
perk_weapAdsMultiplier = 0.5
perk_weapTossMultiplier = 0.5
perk_weapEquipmentUseMultiplier = 0.6
perk_weapMeleeMultiplier = 0.5
perk_weapSpreadMultiplier = 0.65
perk_damageKickReduction = 0.25
perk_flakJacket = 35
; stunprotection's concussion share is script, not a dvar (_weapons.gsc:1375-1376)
StunProtectionScale = 0.1

[Flinch]
; G7
bg_viewKickScale = 0.175
bg_viewKickMin = 0.5
bg_viewKickMax = 90
FlinchTime = 0.5

[View]
; G2, G4, G6
player_standingViewHeight = 60
ViewHeightCrouch = 40
ViewHeightProne = 11
cg_fov = 65
cg_fovMin = 10
cg_fovScale = 1
bg_weaponBobMax = 8
bg_weaponBobLag = 0.25
bg_weaponBobAmplitudeStanding.x = 0.055
bg_weaponBobAmplitudeStanding.y = 0.025
bg_weaponBobAmplitudeDucked.x = 0.045
bg_weaponBobAmplitudeDucked.y = 0.025
bg_weaponBobAmplitudeProne.x = 0.02
bg_weaponBobAmplitudeProne.y = 0.005
bg_weaponBobAmplitudeSprinting.x = 0.02
bg_weaponBobAmplitudeSprinting.y = 0.014
bg_weaponBobAmplitudeRoll = 1.5

[Breath]
; Hold breath: FUN_008e4860, FUN_008dea30, FUN_0052e3d0 (dvars-t6mp.tsv)
player_breath_hold_time = 4.5
player_breath_gasp_time = 0
player_breath_gasp_scale = 2.5
player_breath_hold_lerp = 1.5
player_breath_gasp_lerp = 4
player_breath_fire_delay = 0
player_breath_snd_delay = 1
perk_extraBreath = 5
; Anti-quickscope: FUN_008dac10, FUN_008f0f00
bg_aqs = 1
bg_aqsStyle = 2

[Optics]
cg_sonarAttachmentMaxSpeed = 2.2
cg_sonarAttachmentDistanceFactor = 3
cg_sonarAttachmentSpeedDelay = 0.8
cg_sonarAttachmentSpeedTimeRatio = 0
cg_sonarAttachmentHideFriendlies = 1
SonarFramesPerSecond = 60
cg_rangeFinderMinEnemySpottingDist = -1
RangeFinderDisplayAds = 0.99
RangeFinderMarkHeight = 45
RangeFinderTraceDist = 8192

[AssaultShield]
; BO2's blast protection by a shield (engine dvars, FUN_00966680; consumer FUN_00670940).
shieldBlastDamageProtection_30 = 0.4
shieldBlastDamageProtection_60 = 0.2
shieldBlastDamageProtection_120 = 0.1
shieldBlastDamageProtection_180 = 0
; The deployed shield (FUN_00966680 dvars; _riotshield.gsc).
riotshield_deployed_health = 300
riotshield_bullet_damage_scale = 0.025
riotshield_melee_damage_scale = 1
riotshield_explosive_damage_scale = 1
riotshield_projectile_damage_scale = 0.01
riotshield_deploy_zdiff_max = 30
riotshield_deploy_pitch_max = 20
riotshield_deploy_roll_max = 25
riotshield_deploy_limit_radius = 100
riotshield_destroyed_cleanup_time = 10
riotshield_placement_zoffset = 26

[Regen]
RegenDelay = 5
RegenFullTime = 3

[Building]
BuildingRate = 1

[Projectiles]
ProjectileBounce = 0.3

[Penetration]
