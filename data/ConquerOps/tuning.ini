; ConquerOps gameplay tuning. The same file must reach every player in a game (it ships in
; ConquerOps.big, like weapons.ini). The defaults in crates/zhbo-core/src/tuning.rs must equal
; this file (a test checks it).
;
; BO2's numbers are in BO2's units (inches, inches/s, seconds) under the engine's dvar names, with
; the engine defaults read from t6mp by Ghidra: ~/Documents/BO2-reference/ghidra/answers/G1-G7.md
; (every dvar: dvars-t6mp.tsv there). Keys match case-insensitively, ignoring _ and .

[Movement]
; G2
g_speed = 190
player_sprintTime = 4
player_sprintSpeedScale = 1.5
player_sprintStrafeSpeedScale = 0.667
player_backSpeedScale = 0.7
player_strafeSpeedScale = 0.8
player_sprintForwardMinimum = 105
player_sprintRechargePause = 0
; hard-coded in the engine (G2): sprint restart needs > 1 s, the meter caps at 16383 ms
SprintRestartMinimum = 1
SprintMax = 16.383
StanceCrouchScale = 0.65
StanceProneScale = 0.15
StanceProneDownTime = 0.6
StanceProneUpTime = 0.4
jump_height = 39
bg_gravity = 800
friction = 5.5
stopspeed = 100
jump_stepSize = 18

[Bullets]
; t6mp's bulletrange dvar (FUN_006e86b0): how far a non-spread round is traced, inches. Spread
; classes (shotguns, the Executioner) trace to their damage curve's last range instead.
bulletrange = 8192
; t6mp's antilag (FUN_0066b6e0): a shot is resolved against the players as its shooter saw them, at
; most this many milliseconds back (the lockstep run-ahead is the "ping"). 400 = 12 logic frames.
AntilagMaxRewind = 400

[Perks]
; G1: each applies where its specialty is tested
perk_speedMultiplier = 1.07
perk_sprintMultiplier = 2
perk_sprintRecoveryMultiplier = 0.3
perk_mantleReduction = 0.4
perk_fastLadderClimbMultiplier = 1.75
perk_weapSwitchMultiplier = 0.5
perk_weapReloadMultiplier = 0.5
perk_weapRateMultiplier = 0.75
perk_weapAdsMultiplier = 0.5
perk_weapTossMultiplier = 0.5
perk_weapEquipmentUseMultiplier = 0.6
perk_weapMeleeMultiplier = 0.5
perk_weapSpreadMultiplier = 0.65
perk_damageKickReduction = 0.25
perk_flakJacket = 35
; stunprotection's concussion share is script, not a dvar (_weapons.gsc:1375-1376)
StunProtectionScale = 0.1

[Flinch]
; G7
bg_viewKickScale = 0.175
bg_viewKickMin = 0.5
bg_viewKickMax = 90
FlinchTime = 0.5

[BodyAnimation]
