bg_weaponBobAmplitudeStanding.y = 0.025
bg_weaponBobAmplitudeDucked.x = 0.045
bg_weaponBobAmplitudeDucked.y = 0.025
bg_weaponBobAmplitudeProne.x = 0.02
bg_weaponBobAmplitudeProne.y = 0.005
bg_weaponBobAmplitudeSprinting.x = 0.02
bg_weaponBobAmplitudeSprinting.y = 0.014
bg_weaponBobAmplitudeRoll = 1.5

[Breath]
