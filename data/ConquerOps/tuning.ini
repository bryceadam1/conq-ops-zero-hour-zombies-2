[Drops]
; Dropped weapons: _weapons.gsc dropweaponfordeath and t6mp's item code (FUN_005fab50, FUN_005fae60, FUN_005f9230, FUN_00676d50).
g_maxDroppedWeapons = 16
player_useRadius = 128
UseListDotScale = 256
deletepickupafterawhile = 60
DroppedItemOwnerTime = 1
DropItemForwardSpeed = 10
DropItemRandomSpeed = 100
DropItemUpSpeed = 10
DropItemRandomUpSpeed = 5
DroppedItemHalfSize = 1
PlayerBoxHeight = 70

[Classes]
; Seconds from the match start in which a mid-life class pick applies at once to a General who has not fought.
; (A new General's own first pick always applies at once: every General is picked for.)
ClassChangeGracePeriod = 15

[Regen]
; BO2's _healthoverlay.gsc: whole at once RegenDelay seconds after the last hit (playerHealthRegenTime),
; unless very hurt (at or under healthoverlaycutoff since last whole): then regenrate of full every RegenStep.
RegenDelay = 5
healthoverlaycutoff = 0.55
regenrate = 0.1
RegenStep = 0.05
veryhurttime = 3

[Building]
BuildingRate = 1

[Projectiles]
; The mod's values, for a surface the weapon def has no parallelBounce/perpendicularBounce cell for.
ProjectileBounce = 0.3
ProjectileBounceAlong = 0.6
ProjectileRestSpeed = 3

[Melee]
; t6mp dvar defaults (dvars-t6mp.tsv); the lunge is FUN_008c3770 / FUN_008c34f0
player_meleeRange = 55
player_meleeChargeMaxSpeed = 800
player_meleeChargeFriction = 1200

[Equipment]
; BO2's MP scripts (~/Documents/BO2-reference/gsc-dump/mp/decompiled/t6/maps/mp/), inches and seconds.
; Claymore: gametypes/_weaponobjects.gsc:31-34 (init's scr_weaponobject_* defaults); the
; trigger is :1502, the explosion-radius cap, front distance and cone :1562-1584, the grace wait :1548.
scr_weaponobject_radius = 192
scr_weaponobject_coneangle = 70
scr_weaponobject_mindist = 20
scr_weaponobject_graceperiod = 0.6
; Bouncing Betty: _bouncingbetty.gsc:18-25 (jump and blast :137-145)
bettyradius = 192
bettygraceperiod = 0.6
bettyjumpheight = 65
bettyjumptime = 0.65
; Shock Charge: _proximity_grenade.gsc:19-20
scr_proximityGrenadeDetectionRadius = 150
scr_proximityGrenadeGracePeriod = 0.1
; Trophy System: _trophy_system.gsc:171 (distancesquared < 262144 = 512^2) and :62 (self.ammo = 2)
trophy_system_range = 512
trophy_system_ammo = 2
trophy_intercept_radius = 128
trophy_intercept_max_damage = 105
trophy_intercept_min_damage = 10
; Sensor Grenade: its 800 ms scan while it exists (CG_Missile FUN_004bcac0 -> FUN_004bc570: the
; period, the 400 ms sweep, range sqrt(1e6), the line of sight to +35/+25/+5), its detonation's
; compass ping (FUN_004ab320: time + 6000) and the compass dvars the scan's pings draw by
sensor_scan_cycle_ms = 800
sensor_scan_sweep_ms = 400
sensor_scan_range = 1000
sensor_scan_target_height = 35
sensor_ping_time_ms = 6000
compassStaticImageUpdateTime = 4000
compassSatellitePingFadeTime = 8
; Engineer's specialty_delayexplosive: the dvar default (dvars-t6mp.tsv), waited at
; gametypes/_weaponobjects.gsc:1550-1551
perk_delayExplosiveTime = 0.9
; FMJ's specialty_armorpiercing on scorestreaks (Zero Hour's vehicles/structures):
; gametypes/_class.gsc:859, applied in killstreaks/_ai_tank.gsc:292-293
perk_armorpiercing = 40
; Black Hat: _hacker_tool.gsc:12 (range), :20 and :30 (equipment and vehicle lock, ms of sight),
; :166-170 and :245 (the two 0.05 s script waits from the pull-back to the lock starting). The hack lands
; when the tool fires: once locked and pulled back (the def's iHoldFireTime), after its iFireDelay.
hackertoolmaxequipmentdistance = 2000
equipmenthackertooltimems = 50
vehiclehackertooltimems = 4000
hackertoollockstart = 0.1
; The mod's value: arm time (BO2 waits until the piece stops moving, then activationdelay).
EquipmentArmTime = 1

[Concussion]
; gametypes/_weapons.gsc:1372: time = 2 + 4 * scale (scale 1 at the centre, 0 at the edge)
concussion_time_min = 2
concussion_time_scale = 4
; gametypes/_weapons.gsc:1364-1365: the thrower's own concussion scales over radius * 0.5
concussion_self_radius_scale = 0.5

[Shellshock]
; The GSC's shellshock() durations (crates/zhbo-core/src/shellshock.rs); the shocks themselves
; are converted from the install (the weapon table's Shock blocks).
; _flashgrenades.gsc:38-58: duration = distance * angle * 6, angle 0.5..1, self x0.5, < 0.25 none
flash_duration_scale = 6
flash_angle_min = 0.5
flash_angle_full = 0.8
flash_self_scale = 0.5
flash_min_duration = 0.25
; _flashgrenades.gsc:86-90: flashprotection
flash_protection_scale = 0.1
; _shellshock.gsc:30-35: explosive damage > 10 plays frag_grenade_mp for 0.5 s
blast_shock_min_damage = 10
blast_shock_duration = 0.5
; _empgrenade.gsc:105: shellshock( "flashbang", 1 )
emp_shock_duration = 1
; _proximity_grenade.gsc:24-25, 188-206
proximity_shock_duration = 1.5
scr_proximityGrenadeDOTDamageTime = 0.15
scr_proximityGrenadeDOTDamageInstances = 4
proximity_exit_wait = 0.85
proximity_exit_duration = 0.6
; _empgrenade.gsc:102: empduration = 12
empgrenade_duration = 12
; _globallogic_vehicle.gsc:306-321 getvehicleprojectilescalar: a direct hit (MOD_PROJECTILE) on a
; vehicle deals this share of the weapon's iDamage (its turrets take the same 200 of 1000,
; _turret_killstreak.gsc:903). The mod applies it to every Zero Hour object that is not a soldier;
; key: getvehicleprojectilescalar.<weapon name>, 1 for any weapon not listed
getvehicleprojectilescalar.smaw_mp = 0.2
getvehicleprojectilescalar.fhj18_mp = 0.2
getvehicleprojectilescalar.remote_missile_missile_mp = 10
getvehicleprojectilescalar.remote_mortar_missile_mp = 10
; _globallogic_vehicle.gsc:323-334 getvehicleprojectilesplashscalar: radius damage on a vehicle
; (MOD_PROJECTILE_SPLASH, MOD_GRENADE_SPLASH, MOD_EXPLOSIVE in callback_vehicleradiusdamage :224)
getvehicleprojectilesplashscalar.remote_missile_missile_mp = 10
getvehicleprojectilesplashscalar.remote_mortar_missile_mp = 4
getvehicleprojectilesplashscalar.chopper_minigun_mp = 0.5
; _globallogic_vehicle.gsc:336-347 getvehicleunderneathsplashscalar: MOD_GRENADE_SPLASH on a vehicle
; (callback_vehicledamage :63, which radius damage reaches through finishvehicleradiusdamage):
; C4's blast x 10 x 3 on any vehicle it reaches
getvehicleunderneathsplashscalar.satchel_charge_mp = 30
; _globallogic_vehicle.gsc:70 level.vehicledamagescalar (set in the base _globallogic.gsc, which the
; dump lacks; the series' default)
vehicledamagescalar = 1
; t6mp FUN_008bca80: the view kick's fade, a constant 3000 ms (the file's viewKickFadeTime is unused)
shock_view_kick_fade = 3

[Smoke]
