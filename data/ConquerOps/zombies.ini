Lethal = frag_grenade_zm
LethalCount = 0
Melee = knife_zm

[Weapons]
; One row per weapon TranZit's classic mode includes (zm_transit.gsc include_weapons, :1862-1962):
;   <weapon> = <in_box>, <upgrade>, <cost>, <ammo_cost>, <limit>, <box_weight>, <hint>
; in_box     include_weapon's second argument (default 1, _zm_utility.gsc:2802): 1 if the Mystery
;            Box offers it.
; upgrade    add_zombie_weapon's upgrade_name (zm_transit.gsc custom_add_weapons, :1983-2023): the
;            Pack-a-Punched weapon, or - for none.
; cost       add_zombie_weapon's cost. `mp/zombiemode.csv` overrides it when it has a row for the
;            weapon (_zm_weapons.gsc:526-531, rounded up to ten); the converter applies that.
; ammo_cost  add_zombie_weapon's ammo_cost, or - for its default, round_up_to_ten(cost / 2)
;            (_zm_weapons.gsc:559-560); the table's second column overrides it (:533-534).
; limit      add_limited_weapon's amount (:1945-1965): how many may be out at once, or - for no
;            limit (0: never from the box).
; box_weight include_weapon's weighting function: 1 for default_weighting_func, 0.5 for
;            less_than_normal (:1977-1980).
; hint       add_zombie_weapon's hint (zm_transit.gsc :1983-2025): the localized key of its wall
;            buy's prompt (wall_weapon_update_prompt, _zm_weapons.gsc:1130-1134), or - for none.
; Upgraded weapons are listed too: they are carried, never bought.
