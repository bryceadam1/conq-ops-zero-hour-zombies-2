; Conquer Ops - the Zombies rules BO2 keeps in its map scripts, not in any asset.
;
; Everything BO2 keeps in data comes from the player's install instead: the weapon definitions
; (TranZit's pool, zhbo_formats::weapon::ZM_TRANSIT_POOL) and Zombies' rule table
; `mp/zombiemode.csv` (common_zm), which the converter ships as is. This file holds only what
; TranZit's GSC hard-codes, transcribed from the decompiled scripts with the line each comes from.
; No number here may be copied into code: the converter and the core read it.

[Zombie]
; The zombie's own numbers BO2 sets in script:
; MeleeDamage  its swipe on a player (self.meleedamage, _zm_spawner.gsc:257), dealt whole by
;              player_damage_override (_zm.gsc:4100-4109): two swipes down a 100-health survivor
;              (_zm_perks.gsc:2091-2101).
MeleeDamage = 60

[Rounds]
; The round engine's numbers BO2 hard-codes in script (the rest are the install's
; mp/zombiemode.csv, read by set_zombie_var's rule):
; AiLimit          level.zombie_ai_limit: how many zombies may be alive at once (_zm.gsc:114).
; BetweenRounds    zombie_between_round_time's default, seconds (_zm.gsc:872), the table having no
;                  row for it: round_over's wait (:3363).
; SpawnDelayFloor  round_think's floor on zombie_spawn_delay, seconds (:3496-3501), which shrinks
;                  by SpawnDelayDecay each round above it.
; Difficulty       set_zombie_var's column is difficulty + 1, difficulty 1 ("original", :858-859).
AiLimit = 24
BetweenRounds = 10
SpawnDelayFloor = 0.08
SpawnDelayDecay = 0.95
Difficulty = 1
; StartRound            the game's startRound setting (default 1, _zm.gsc:835-836).
; StartingPointsPerRound level.player_starting_points = round_number * 500 (_zm.gsc:839), each
;                       player's score at the start (_zm_stats.gsc:184).
; RespawnFloorRound / RespawnFloorPoints
;                       spectators_respawn: a player brought back after round 6 with under 1500
;                       points gets 1500 (_zm.gsc:2543-2550). Co-op only: round_think respawns the
;                       dead when there is more than one player (:3485-3492).
StartRound = 1
StartingPointsPerRound = 500
RespawnFloorRound = 6
RespawnFloorPoints = 1500

[LastStand]
; A survivor's last stand (_zm_laststand.gsc), entered instead of dying while another survivor is
; up (player_damage_override, _zm.gsc:4239-4252); the last one standing dies and the game ends.
; BleedoutTime  player_lastStandBleedoutTime, seconds (_zm.gsc:963): laststand_bleedout counts it
;               down, holding at the end while he is being revived (_zm_laststand.gsc:379-417).
; ReviveTime    revive_do_revive's revivetime, seconds (_zm_laststand.gsc:834), halved by Quick
;               Revive (:836-837).
; ReviveRadius  revive_trigger_radius (_zm.gsc:962): the downed player's trigger_radius, as wide
;               as it is tall (revive_trigger_spawn, _zm_laststand.gsc:651-652).
; ReviveFacing  is_facing: the reviver's flat view on the downed player, dot over this
;               (_zm_laststand.gsc:818-829).
; Pistol        level.laststandpistol (_zm.gsc:830), his pistol when he carries none with ammo.
; PistolValues  level.pistol_values (_zm.gsc:2163-2202): the pistol he goes down with is the one
;               he carries ranked last in it (last_stand_best_pistol, :2257-2294), with ammo unless
;               it is the default pistol.
BleedoutTime = 45
ReviveTime = 3
ReviveRadius = 75
ReviveFacing = 0.9
Pistol = m1911_zm
PistolValues = m1911_zm, c96_zm, cz75_zm, cz75dw_zm, kard_zm, fiveseven_zm, beretta93r_zm, beretta93r_extclip_zm, fivesevendw_zm, rnma_zm, python_zm, judge_zm, cz75_upgraded_zm, cz75dw_upgraded_zm, kard_upgraded_zm, fiveseven_upgraded_zm, m1911_upgraded_zm, c96_upgraded_zm, beretta93r_upgraded_zm, beretta93r_extclip_upgraded_zm, fivesevendw_upgraded_zm, rnma_upgraded_zm, python_upgraded_zm, judge_upgraded_zm, ray_gun_zm, raygun_mark2_zm, freezegun_zm, ray_gun_upgraded_zm, raygun_mark2_upgraded_zm, freezegun_upgraded_zm, microwavegundw_zm, microwavegundw_upgraded_zm

[WallBuys]
; TranZit classic's wall buys: the map's weapon_upgrade, bowie_upgrade, tazer_upgrade and
; claymore_purchase entities (zm_transit.ff's map entities) that init_spawnable_weapon_upgrade keeps
; for zclassic_transit (no script_noteworthy, or one naming it; _zm_weapons.gsc:839-881), in the
; map's order, each with the model its target struct shows on the wall (:914-918):
;   <weapon> = <model>[, <cost>, <hint>]
; The melee buys name their own cost and prompt (_zm_melee_weapon::init's, from _zm_weap_bowie.gsc:11-16
; and _zm_weap_tazer_knuckles.gsc:17-23); the rest are the weapon roster's, below.
; UpgradedAmmoCost  get_upgraded_ammo_cost's default (:1551-1559): ammo for a Pack-a-Punched
;                   weapon at its wall (weapon_spawn_think, :2112-2121).
UpgradedAmmoCost = 4500
sticky_grenade_zm = semtex_bag
rottweil72_zm = t6_wpn_shotty_olympia_world
ak74u_zm = t6_wpn_smg_ak74u_world
m14_zm = t6_wpn_ar_m14_world
870mcs_zm = t6_wpn_shotty_870mcs_world
mp5k_zm = t6_wpn_smg_mp5_world
m16_zm = t6_wpn_ar_m16a2_world
claymore_zm = t6_wpn_claymore_world
bowie_knife_zm = world_knife_bowie, 3000, ZOMBIE_WEAPON_BOWIE_BUY
tazer_knuckles_zm = t6_wpn_taser_knuckles_view, 6000, ZOMBIE_WEAPON_TAZER_BUY

[PowerUps]
; The power-ups (_zm_powerups.gsc). TranZit classic includes nuke, insta_kill, double_points,
; full_ammo, insta_kill_ug and carpenter (zm_transit.gsc include_powerups, :1602-1617); listed here
; in add_zombie_powerup's order (init_powerups, :79-103), each with its model and how it drops
; with the regular power-ups (func_should_drop_with_regular_powerups): always, never, or
; carpenter (func_should_drop_carpenter: five windows broken, :2697-2703; the Zombies map has none).
;   <name> = <model>, <drops>
; DropIncrement       zombie_powerup_drop_increment (:47): points earned past the first threshold
;                     (players * zombie_score_start_Np plus this) before a drop is due; it grows by
;                     IncrementGrowth each time (watch_for_drop, :384-413).
; DropMaxPerRound     zombie_powerup_drop_max_per_round (:48).
; RandomChance        powerup_drop's randomint( 100 ) > 2 test (:491-497): a kill drops one anyway
;                     3 times in 100.
; DropHeight          powerup_drop's spawn 40 inches over the kill (:500).
; Life / BlinkTime    powerup_timeout: 15 s, then 40 blinks of 15 x 0.5 + 10 x 0.25 + 15 x 0.1 s
;                     (:1363-1424).
; GrabRange           powerup_grab's range_squared 4096: 64 inches from a player (:968).
; Duration            insta_kill and double_points' 30 s (zombie_powerup_*_time, :42-45).
; NukePoints          nuke_powerup's 400 to every player (:1502-1505); NukeDelay its 0.5 s before
;                     the zombies die, each one randomfloatrange( 0.1, 0.7 ) after the last (:1449-1500).
; FlashFrom           powerup_hud_monitor's flashing table starts at 10 s left (:157-185).
DropIncrement = 2000
IncrementGrowth = 1.14
DropMaxPerRound = 4
RandomChance = 3
DropHeight = 40
Life = 15
BlinkTime = 11.5
GrabRange = 64
Duration = 30
NukePoints = 400
NukeDelay = 0.5
NukeGapMin = 0.1
NukeGapMax = 0.7
FlashFrom = 10
nuke = zombie_bomb, always
insta_kill = zombie_skull, always
full_ammo = zombie_ammocan, always
double_points = zombie_x2_icon, always
carpenter = zombie_carpenter, carpenter
insta_kill_ug = zombie_skull, never

[MagicBox]
; The Mystery Box (_zm_magicbox.gsc). Which weapon: the first, in a shuffled list of the roster's,
; that the box offers (in_box), the buyer has not got (nor its upgrade) and is under its limit
; across the players (treasure_chest_chooseweightedrandomweapon, :911-933; TranZit sets no custom
; weights, so box_weight plays no part).
; Cost / Hint      the chest's zombie_cost 950 (:72) and its prompt (_zm.gsc:739); TakeHint the
;                  buyer's prompt while the weapon floats (boxstub_update_prompt, :209-235).
; Model            the zbarrier zmcore_MagicBox's model (zm_transit's map entities).
; SpinTime         treasure_chest_weapon_spawn's 40 cycles, 20 x 0.05 + 10 x 0.1 + 5 x 0.2 +
;                  3 x 0.3 s, and its 0.1 s before the weapon shows (:1078-1112).
; FloatHeight      the weapon 40 inches over the box (:1113-1116).
; OfferTime        treasure_chest_timeout (:852-858): only the buyer may take it meanwhile.
; CloseTime        the 1 s after the lid has closed (:613-618; the close animation is not timed).
; MoveTime         treasure_chest_move: 0.1 s, then 7 + 5 s with no fire sale before the box
;                  shows at its next place (:740-768; the teddy's flight is not timed).
; Joker...         the teddy (treasure_chest_weapon_spawn, :1136-1185): never before MinMoveUsage
;                  pulls; then a percent chance of JokerEarly up to 8 pulls, certain at
;                  JokerFirstMoveAt pulls if it never moved, then JokerMid up to 13 and JokerLate
;                  after once it has. A teddy gives the buyer his points back (:490-491).
Cost = 950
Hint = ZOMBIE_RANDOM_WEAPON_950
TakeHint = ZOMBIE_TRADE_WEAPON
Model = p6_anim_zm_magic_box
SpinTime = 4.0
FloatHeight = 40
OfferTime = 12
CloseTime = 1
MoveTime = 12.1
MinMoveUsage = 4
JokerFirstMoveAt = 8
JokerEarly = 15
JokerMid = 30
JokerLate = 50

[Perks]
; TranZit classic's perk machines (zm_transit's map entities zm_perk_machine for
; zclassic_perks_transit): Speed Cola, Stamin-Up, Jugger-Nog, Double Tap, Quick Revive (and
; Tombstone, not ported yet; Pack-a-Punch is its own). Bought with the use key while the player
; has fewer than PerkLimit (level.perk_purchase_limit, _zm_perks.gsc:23) and not that one
; (vending_trigger_think); lost when he goes down (perk_think). The Zombies map has no power
; switch: every machine is on.
;   <specialty> = <model>, <cost>, <solo cost or ->, <hint>, <HUD icon>
; cost       vending_trigger_think's switch (:1692-1730); Quick Revive costs 500 alone.
; hint       reset_vending_hint_string (:1595-1645), Quick Revive's _SOLO alone.
; icon       hudperkszombie.lua's material for the perk's client field.
; JuggHealth       zombie_perk_juggernaut_health (:69): his health with Jugger-Nog, of the
;                  player's 100 (perk_set_max_health_if_jugg, :2065-2095).
; ReviveScale      revive_do_revive halves the revive for a reviver with Quick Revive
;                  (_zm_laststand.gsc:836-837).
; SoloReviveTime / SoloLives
;                  alone, Quick Revive revives him after 10 s (wait_and_revive, _zm.gsc:4340-4356),
;                  bought at most 3 times (give_perk's solo_lives_given, _zm_perks.gsc:2017-2032).
PerkLimit = 4
JuggHealth = 160
ReviveScale = 0.5
SoloReviveTime = 10
SoloLives = 3
specialty_fastreload = zombie_vending_sleight, 3000, -, ZOMBIE_PERK_FASTRELOAD, specialty_fastreload_zombies
specialty_longersprint = zombie_vending_marathon, 2000, -, ZOMBIE_PERK_MARATHON, specialty_marathon_zombies
specialty_armorvest = zombie_vending_jugg, 2500, -, ZOMBIE_PERK_JUGGERNAUT, specialty_juggernaut_zombies
specialty_rof = zombie_vending_doubletap2, 2000, -, ZOMBIE_PERK_DOUBLETAP, specialty_doubletap_zombies
specialty_quickrevive = zombie_vending_revive, 1500, 500, ZOMBIE_PERK_QUICKREVIVE, specialty_quickrevive_zombies

[PackAPunch]
; Pack-a-Punch (_zm_perks.gsc vending_weapon_upgrade, :481-681). TranZit's is a buildable; the
; Zombies map stands it built and on, on the wall-buy ring after the perk machines.
; Cost / Hint      vending_weapon_upgrade_cost (:682-708): 5000.
; TakeHint         the buyer's prompt while the weapon waits (:637).
; Model            its machine (zm_perk_machine specialty_weapupgrade's model).
; UpgradeTime      third_person_weapon_upgrade's 0.35 s and 3 s before the weapon comes out
;                  (:383-392).
; TakeTime         level.packapunch_timeout (:66): only the buyer may take it; left, it is lost.
; TranZit also lets an upgraded gun be packed again for an attachment (zm_transit.gsc:286,
; attachment_cost 2000): not ported, the converter making no attachment variants of the upgraded
; weapons.
Cost = 5000
Hint = ZOMBIE_PERK_PACKAPUNCH
TakeHint = ZOMBIE_GET_UPGRADED
Model = p6_anim_zm_buildable_pap
UpgradeTime = 3.35
TakeTime = 15

[Layout]
; Where the Zombies map stands its structures (the mod's own map, no BO2 counterpart): every wall
; buy around each player start (its survivors start apart, where BO2's co-op starts together),
; evenly on a ring this far from it (Zero Hour units), facing it.
WallBuyRing = 160

[Survivor]
; A survivor General's kit at spawn (BO2's spawned_player, _zm.gsc:1306-1313):
; StartWeapon  level.start_weapon (_zm.gsc:833), given with its start ammo and nothing else
;              (give_start_weapon, _zm_utility.gsc:3524-3531): no second gun, no held knife.
; Lethal       level.zombie_lethal_grenade_player_init (zm_transit.gsc:1837), given empty
;              (_zm.gsc:1308-1313); the rounds top it up (award_grenades_for_survivors).
; Tactical     level.zombie_tactical_grenade_player_init: none (zm_transit.gsc:1841).
; Melee        level.zombie_melee_weapon_player_init (zm_transit.gsc:1853).
