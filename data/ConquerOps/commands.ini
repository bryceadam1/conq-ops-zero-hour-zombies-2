; First-person commands: the accepted input around the canonical language (docs/COMMANDS.md section
; 4, "Synonyms and aliases"). The normaliser (zhbo_core::command::normal) rewrites a line with these
; tables, longest phrase first, before parsing; canonical text never holds a synonym. A player's
; own file, ConquerOps.commands.ini beside the profile, takes the same sections and is read after
; this one (its entries win).
;
; [Words]: phrase = reading | other reading | ...
;   Each reading is canonical words; <none> drops the phrase. A phrase that is canonical words
;   itself (make, on me) lists itself first. A phrase with several readings is
;   tried in turn: the first reading whose command parses and resolves is used, and if two
;   readings resolve to different commands the player is asked which.
; [Aliases]: name = plural, plural, ...
;   A word for several types or classes, written as their canonical plurals. Only the ones the
;   match has count. It stands for all of them, so it is read where a bare plural goes
;   ("tanks move to me"); after a determiner ("the nearest tank") it is not.

