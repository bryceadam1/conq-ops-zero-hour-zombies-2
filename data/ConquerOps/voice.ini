; Voice commands' models (docs/COMMANDS.md section 11). The launcher downloads them at install
; into voice/<Dir>/ beside itself and checks each file's size and SHA-256; none ships with the
; mod. A file is: name | URL | size in bytes | SHA-256.

; Speech recognition: OpenAI's Whisper base.en (MIT), pinned to a Hugging Face commit. base.en
; over small.en: after snapping both hear 90% of names whole, at 351 ms against 940 ms on the CPU
; and 279 MB against 925 MB (voice_listen, 120 spoken commands).
