; ConquerOps Create-a-Class presets. The same file must reach every player in a game (it ships
; in ConquerOps.big, like weapons.ini): a choose-class message carries an index into this list,
; so the list must be identical on every client.
; Defaults in crates/zhbo-core/src/classes.rs must match this file. Each class is one block:
; Name is what the pick menu shows, Spec is the kit (`Loadout::with_spec`: primary/secondary/
; lethal/tactical/melee/perks, weapons are catalog ids, perks are BO2 names with no spaces).
;
; These are BO2's five default classes, shared across all ten class sets (cacutility.lua's
; `defaultClassNames`: class_custom_assault/smg/lmg/cqb/sniper; reset_classes.cfg's
; `equipdefaultclass 0..4`). The kits come from the default-class column of mp/statstable.csv:
; the row naming a class in that column is one of its items. Every premade carries the frag, two
; concussions (the tactical's magazine), Lightweight, Toughness and Dexterity, and no attachments.

Class assault
  Name = Assault
  Spec = primary=tar21_mp;secondary=smaw_mp;lethal=frag_grenade_mp;tactical=concussion_grenade_mp;melee=knife_held_mp;perks=Lightweight,Toughness,Dexterity
End

