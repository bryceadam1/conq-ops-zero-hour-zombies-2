; Conquer Ops - the General's own command set (shown while the General is under RTS control).

; Slots are column-major (odd numbers are the top row): each gun sits over its order — the primary
; over Reload, the secondary over Knife — then the Lethal over the Tactical.
CommandSet ZHBO_GeneralCommandSet
  1  = Command_ZHBO_TakeControl
  2  = Command_ZHBO_BuildMenu
  3  = Command_ZHBO_SwitchToPrimary
  4  = Command_ZHBO_Reload
  5  = Command_ZHBO_SwitchToSecondary
  6  = Command_ZHBO_Melee
  7  = Command_ZHBO_Lethal
  8  = Command_ZHBO_Tactical
  10 = Command_ZHBO_ChooseClass
  11 = Command_AttackMove
  13 = Command_Guard
  14 = Command_Stop
End

; The class set (ZHBO_ClassPage1) is built in code at startup from the live class list
; (ZhboControlBar.cpp + zhbo_core::classicons), not declared here: the custom slots come from the
; active class set of the player's profile. It is one page: Take Control, the five presets, up to
; five customs, and Back in the bottom-right slot.
