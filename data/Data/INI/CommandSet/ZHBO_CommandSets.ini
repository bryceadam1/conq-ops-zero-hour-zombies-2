; Conquer Ops - the General's own command set (shown while the General is under RTS control).

CommandSet ZHBO_GeneralCommandSet
  1  = Command_ZHBO_TakeControl
  2  = Command_ZHBO_BuildMenu
  3  = Command_ZHBO_SwitchToPrimary
  5  = Command_ZHBO_SwitchToSecondary
  7  = Command_ZHBO_SwitchToLethal
  9  = Command_ZHBO_SwitchToTactical
  10 = Command_ZHBO_ChooseClass
  11 = Command_AttackMove
