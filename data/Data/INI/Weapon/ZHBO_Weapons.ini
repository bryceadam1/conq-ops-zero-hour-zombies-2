; Conquer Ops - weapons used by the General.
;
; The *_FX weapons never deal damage: zhbo-core decides when a first-person shot happens and what it
; hits (Black Ops 2 rules), then fires these with inflictDamage = false purely for the muzzle flash,
; tracer and sound, and applies the damage itself through Object::attemptDamage.
; ZHBO_GeneralRifle is what the General shoots with while under normal RTS control.

Weapon ZHBO_MTAR_FX
  PrimaryDamage           = 0.0
  PrimaryDamageRadius     = 0.0
  AttackRange             = 1000.0
  DamageType              = SMALL_ARMS
  DeathType               = NORMAL
  WeaponSpeed             = 999999.0
  ProjectileObject        = NONE
  FireFX                  = WeaponFX_GenericMachineGunFire
  FireSound               = RangerWeapon
  RadiusDamageAffects     = ENEMIES
  DelayBetweenShots       = 0
  ClipSize                = 0
End

