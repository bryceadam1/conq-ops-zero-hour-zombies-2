; The General's third slot: only the throw. Zero Hour aims it (the General turns, winds up and
; throws); zhbo-core throws the BO2 grenade itself from his hand at the target, the lethal or the
; tactical as the command bar chose, with its own fuse, bounces and blast (as in first person). A
; token of damage, because Zero Hour won't attack with a weapon that does none.
Weapon ZHBO_GeneralGrenade
  PrimaryDamage           = 0.01
  PrimaryDamageRadius     = 0.0
  AttackRange             = 150.0
  MinimumAttackRange      = 20.0
  DamageType              = SMALL_ARMS
  DeathType               = NORMAL
  WeaponSpeed             = 999999.0
  ProjectileObject        = NONE
  RadiusDamageAffects     = ENEMIES NEUTRALS
  FireSound               = RangerFlashBangWeapon
  PreAttackDelay          = 450
  PreAttackType           = PER_SHOT
  DelayBetweenShots       = 0
  ClipSize                = 1
  ClipReloadTime          = 1500
  AutoReloadsClip         = Yes
End
