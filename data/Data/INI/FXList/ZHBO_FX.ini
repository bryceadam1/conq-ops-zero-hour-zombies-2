; Conquer Ops - first-person weapon effects, played at the viewmodel's bones (ZhboViewmodel.cpp).
; Built from Zero Hour's own particle systems. The muzzle flash (ZHBO_ViewmodelMuzzle) uses BO2's
; flash texture, so it is generated into ConquerOps_BO2.big (zhbo_assets::fx).

FXList ZHBO_ViewmodelBrass
  ParticleSystem
    Name = FallingShells
    OrientToObject = Yes
  End
End
