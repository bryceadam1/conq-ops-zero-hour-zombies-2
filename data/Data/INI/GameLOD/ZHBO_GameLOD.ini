; Conquer Ops - dynamic detail overrides (loaded after GameLOD.ini; only the fields named change).
;
; Below 20 fps Zero Hour skips every second (Medium) or three of four (Low) new particles of a
; priority under MinParticleSkipPriority. The smoke screen is AREA_EFFECT and carries gameplay (it
; blocks sight in the sim at every frame rate), so it must look whole at every frame rate too:
; skipping stops at AREA_EFFECT. The two fields that reach the logic, DebrisSkipMask and
; SlowDeathScale, stay at Zero Hour's no-ops at every level (zhbo-assets' detail tests pin them).
DynamicGameLOD = Medium
  MinParticleSkipPriority = AREA_EFFECT
End

DynamicGameLOD = Low
  MinParticleSkipPriority = AREA_EFFECT
End
