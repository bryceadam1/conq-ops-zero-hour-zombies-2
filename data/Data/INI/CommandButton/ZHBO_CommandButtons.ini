; Conquer Ops - command buttons.
; The Construct buttons are inserted into every faction's Command Center command set at startup by
; ZhboBridge (Zhbo_InjectCommandButtons), so the game's own CommandSet.ini is never replaced.

CommandButton Command_ZHBO_ConstructGeneral_USA
  Command          = UNIT_BUILD
  Object           = ZHBO_General_USA
  TextLabel        = CONTROLBAR:ZHBO_ConstructGeneral
  ButtonImage      = SABurton
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ConstructGeneral
End

