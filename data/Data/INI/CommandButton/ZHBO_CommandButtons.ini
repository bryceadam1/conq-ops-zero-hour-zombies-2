; The General's Create a Class entry: swaps his command bar into the class set for a pick (the
; normal set returns on Back or after a pick). Also on the normal set, so a classed General can
; re-pick at any time.
CommandButton Command_ZHBO_ChooseClass
  Command          = ZHBO_CHOOSE_CLASS
  TextLabel        = CONTROLBAR:ZHBO_ChooseClass
  ButtonImage      = ZHBO_Button_ChooseClass
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ChooseClass
End

; The General's class menu: one button per class slot (the five shipped presets, then the five
; custom slots of the profile's active class set). The command set itself is built in code at
; startup and at every game start (ZhboControlBar.cpp), so unused custom slots are simply absent;
; the bar is one page. Rows 11..15 exist only because the ABI's class-button capacity is fifteen
; (ZHBO_CLASS_BUTTONS); they never carry a class. All of these share the same command; the bridge
; tells them apart by the command window being dispatched. Their labels come from the live class
; list (strings.rs: CONTROLBAR:ZHBO_ClassButton01..15) and the kit icons are drawn over the button
; every frame, not baked into the ButtonImage.
CommandButton Command_ZHBO_Class01
  Command          = ZHBO_CHOOSE_CLASS
  TextLabel        = CONTROLBAR:ZHBO_ClassButton01
  ButtonImage      = ZHBO_Button_ClassTile
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ClassButton
End

