; The class set's own navigation: Back returns to the General's normal commands (handled by name in
; ZhboBridge, the same ZHBO_TAKE_CONTROL route as the Build menu's buttons; its plain tile gets a
; drawn glyph from the bridge). Next is kept for the old paging, but the class set is one page now
; (ten classes at most), so nothing places it and its handler does nothing.
CommandButton Command_ZHBO_ClassNext
  Command          = ZHBO_TAKE_CONTROL
  TextLabel        = CONTROLBAR:ZHBO_ClassNext
  ButtonImage      = ZHBO_Button_ClassTile
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ClassNext
End

