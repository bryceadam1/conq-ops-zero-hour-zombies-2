; Conquer Ops - command buttons.
; The Construct buttons are inserted into every faction's Command Center command set at startup by
; ZhboBridge (Zhbo_InjectCommandButtons), so the game's own CommandSet.ini is never replaced.

CommandButton Command_ZHBO_ConstructGeneral_USA
  Command          = UNIT_BUILD
  Object           = ZHBO_General_USA
  TextLabel        = CONTROLBAR:ZHBO_ConstructGeneral
  ButtonImage      = SABurton
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ConstructGeneral
End

CommandButton Command_ZHBO_ConstructGeneral_China
  Command          = UNIT_BUILD
  Object           = ZHBO_General_China
  TextLabel        = CONTROLBAR:ZHBO_ConstructGeneral
  ButtonImage      = SNBlkLotus2
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ConstructGeneral
End

CommandButton Command_ZHBO_ConstructGeneral_GLA
  Command          = UNIT_BUILD
  Object           = ZHBO_General_GLA
  TextLabel        = CONTROLBAR:ZHBO_ConstructGeneral
  ButtonImage      = SUJermanKell1
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ConstructGeneral
End

; The General's Build menu: his faction's dozer (or worker) build buttons, made into a command set
; at startup (ZhboBridge), with Back to his own command bar. Both go to the bridge like Take Control.
CommandButton Command_ZHBO_BuildMenu
  Command          = ZHBO_TAKE_CONTROL
  TextLabel        = CONTROLBAR:ZHBO_BuildMenu
  ButtonImage      = ZHBO_Button_Build
  ButtonBorderType = BUILD
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_BuildMenu
End

CommandButton Command_ZHBO_BuildBack
  Command          = ZHBO_TAKE_CONTROL
  TextLabel        = CONTROLBAR:ZHBO_BuildBack
  ButtonImage      = ZHBO_Button_Back
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_BuildBack
End

CommandButton Command_ZHBO_TakeControl
  Command          = ZHBO_TAKE_CONTROL
  TextLabel        = CONTROLBAR:ZHBO_TakeControl
  ButtonImage      = ZHBO_Button_TakeControl
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_TakeControl
End

; The General's Create a Class entry: opens the class pick screen from the command bar, so a class
; can be chosen without leaving the overhead view (BO2 opens the same screen from the lobby).
CommandButton Command_ZHBO_ChooseClass
  Command          = ZHBO_CHOOSE_CLASS
  TextLabel        = CONTROLBAR:ZHBO_ChooseClass
  ButtonImage      = ZHBO_Button_ChooseClass
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_ChooseClass
End

; The General's weapons, switched like the Ranger's. The lethal and the tactical are both the third
; slot (a stand-in: zhbo-core throws the BO2 grenade); the button says which (ZhboBridge). Their icons are the loadout's BO2 HUD icons
; (zhbo-assets); the ammo left is drawn over each (ZhboBridge).
CommandButton Command_ZHBO_SwitchToPrimary
  Command          = SWITCH_WEAPON
  WeaponSlot       = PRIMARY
  Options          = CHECK_LIKE OK_FOR_MULTI_SELECT
  TextLabel        = CONTROLBAR:ZHBO_Primary
  ButtonImage      = ZHBO_Button_Primary
  ButtonBorderType = ACTION
  DescriptLabel    = CONTROLBAR:ToolTipZHBO_Primary
End

