; Conquer Ops - the General: you, on the battlefield.
;
; Built from any Command Center (button injected at startup). "Take Control" hands the unit to
; zhbo-core for first-person play; while it is first-person controlled its AIUpdate and Physics are
; suspended and zhbo-core moves it every logic frame. Otherwise it is an ordinary hero infantry unit,
; so enemies target and damage it like any other.
;
; The file name starts with ZZZ so it loads after the stock Object INIs it borrows art from.
; Art, voices and locomotors are referenced by name from the player's own Zero Hour install.

Object ZHBO_General_USA
  SelectPortrait        = SABurton_L
  ButtonImage           = SABurton

  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model               = AIHERO_SKN
      IdleAnimation       = AIHERO_SKL.AIHERO_STA 0 25
      IdleAnimation       = AIHERO_SKL.AIHERO_IDA
      IdleAnimation       = AIHERO_SKL.AIHERO_IDB
      AnimationMode       = ONCE
      TransitionKey       = TRANS_Stand
      WeaponFireFXBone    = PRIMARY Muzzle
      WeaponMuzzleFlash   = PRIMARY MuzzleFX
      HideSubObject       = MUZZLEFX01
    End
    ConditionState        = MOVING
      Animation           = AIHERO_SKL.AIHERO_RNA 26
      AnimationMode       = LOOP
      Flags               = RANDOMSTART
      TransitionKey       = TRANS_Walking
      ParticleSysBone     = None InfantryDustTrails
      HideSubObject       = MUZZLEFX01
    End
    AliasConditionState   = MOVING FIRING_A
    AliasConditionState   = MOVING BETWEEN_FIRING_SHOTS_A
    AliasConditionState   = MOVING RELOADING_A
    ConditionState        = FIRING_A
      Animation           = AIHERO_SKL.AIHERO_ATA
      AnimationMode       = ONCE
      AnimationSpeedFactorRange = 1.5 1.5
      TransitionKey       = TRANS_FiringA
    End
    ConditionState        = BETWEEN_FIRING_SHOTS_A
      Animation           = AIHERO_SKL.AIHERO_ATA
      AnimationMode       = MANUAL
      Flags               = START_FRAME_LAST
      WaitForStateToFinishIfPossible = TRANS_FiringA
    End
    AliasConditionState   = RELOADING_A
    ConditionState        = DYING
      Animation           = AIHERO_SKL.AIHERO_DTA
      Animation           = AIHERO_SKL.AIHERO_DTB
      AnimationMode       = ONCE
      TransitionKey       = TRANS_Dying
    End
  End

  DisplayName           = OBJECT:ZHBO_General
  Side                  = America
  EditorSorting         = INFANTRY
  TransportSlotCount    = 1
  VisionRange           = 200
  ShroudClearingRange   = 500
  BuildCost             = 1000
  BuildTime             = 10.0
  ExperienceValue       = 100 150 200 300
  ExperienceRequired    = 0 200 400 800
  IsTrainable           = Yes
  CrushableLevel        = 2
  CommandSet            = ZHBO_GeneralCommandSet
  MaxSimultaneousOfType = 1
  MaxSimultaneousLinkKey = ZHBO_General

  WeaponSet
    Conditions          = None
    Weapon              = PRIMARY ZHBO_GeneralRifle
    AutoChooseSources   = PRIMARY FROM_PLAYER FROM_SCRIPT FROM_AI
  End
  ArmorSet
    Conditions          = None
    Armor               = HumanArmor
    DamageFX            = InfantryDamageFX
  End

  VoiceSelect           = ColonelBurtonVoiceSelect
  VoiceMove             = ColonelBurtonVoiceMove
  VoiceAttack           = ColonelBurtonVoiceAttack
  VoiceFear             = ColonelBurtonVoiceFear
  VoiceGuard            = ColonelBurtonVoiceMove
  UnitSpecificSounds
    VoiceCreate         = ColonelBurtonVoiceCreate
  End

  RadarPriority         = UNIT
  KindOf                = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS INFANTRY SCORE HERO

  Body = ActiveBody ModuleTag_02
    MaxHealth           = 500.0
    InitialHealth       = 500.0
  End
  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
  End
  Locomotor = SET_NORMAL ColonelBurtonGroundLocomotor ColonelBurtonCliffLocomotor
  Behavior = PhysicsBehavior ModuleTag_04
    Mass                = 5.0
  End
  Behavior = SlowDeathBehavior ModuleTag_05
    DeathTypes          = ALL
    SinkDelay           = 3000
    SinkRate            = 0.5
    DestructionDelay    = 8000
    FX                  = INITIAL FX_ColonelBurtonDie
  End

  Geometry              = CYLINDER
  GeometryMajorRadius   = 10.0
  GeometryMinorRadius   = 10.0
  GeometryHeight        = 12.0
  GeometryIsSmall       = Yes
  Shadow                = SHADOW_DECAL
  ShadowSizeX           = 14
  ShadowSizeY           = 14
  ShadowTexture         = ShadowI
  BuildCompletion       = APPEARS_AT_RALLY_POINT
End

