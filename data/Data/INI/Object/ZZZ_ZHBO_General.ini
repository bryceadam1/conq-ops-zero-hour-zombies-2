; The General's thrown lethal (a frag) under RTS control. zhbo-assets swaps in BO2's grenade model.
Object ZHBO_GeneralGrenadeShell
  Draw = W3DModelDraw ModuleTag_01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model = NVMBuggy_m
    End
  End
  DisplayName      = OBJECT:ZHBO_General
  EditorSorting    = SYSTEM
  ArmorSet
    Armor = ProjectileArmor
  End
  VisionRange = 0.0
  KindOf = PROJECTILE
  Body = ActiveBody ModuleTag_02
    MaxHealth       = 100.0
    InitialHealth   = 100.0
  End
  Behavior = DestroyDie ModuleTag_03
  End
  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 1
  End
  Behavior = DumbProjectileBehavior ModuleTag_05
    FirstHeight                     = 30
    SecondHeight                    = 60
    FirstPercentIndent              = 30%
    SecondPercentIndent             = 70%
    FlightPathAdjustDistPerSecond   = 0
  End
  Geometry = Sphere
  GeometryIsSmall = Yes
  GeometryMajorRadius = 1.0
End
