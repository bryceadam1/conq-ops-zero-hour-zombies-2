[package]
name = "zhbo-voice"
description = "Voice commands: Whisper, the snapper and the fine-tuned translator to the canonical command language with its grammar-constrained decoder, and the game's conquerops-voice process (docs/COMMANDS.md section 11)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "conquerops-voice"
path = "src/bin/conquerops-voice.rs"

[features]
# Apple's GPU through candle's Metal backend (the model runs on the CPU without it).
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
zhbo-core = { path = "../zhbo-core", default-features = false }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
# The microphone, for the conquerops-voice process.
cpal = "0.18"
# Whisper's log-mel, computed exactly as openai/whisper does (hear::log_mel).
rustfft = "6.4"
