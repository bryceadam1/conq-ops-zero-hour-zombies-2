[package]
name = "zhbo-voice"
description = "Voice commands: the fine-tuned translator from speech to the canonical command language, with the grammar-constrained decoder (docs/COMMANDS.md section 11)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Apple's GPU through candle's Metal backend (the model runs on the CPU without it).
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
zhbo-core = { path = "../zhbo-core", default-features = false }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde_json = "1"
