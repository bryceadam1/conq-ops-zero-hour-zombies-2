[package]
name = "zhbo-core"
description = "Black Ops 2-style first-person General gameplay, linked into a source-built Zero Hour."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# staticlib: linked into generalszh.exe by host/zhbo/CMakeLists.txt. rlib: unit tests and tools.
crate-type = ["staticlib", "rlib"]

[features]
# The wgpu renderer (zhbo-gfx) and its C ABI, for builds with GGC_BGFX_RENDERER=wgpu.
renderer = ["dep:zhbo-gfx"]
# The in-game autopilot test harness (client/autopilot.rs, ZHBO_AUTOPILOT): the scripted input
# driver. On by default so unit tests and the Windows autotest run; release builds can strip it.
default = ["autopilot"]
autopilot = []

[dependencies]
zhbo-requirements = { path = "../zhbo-requirements" }
zhbo-native = { path = "../zhbo-native" }
zhbo-gfx = { path = "../zhbo-gfx", optional = true }
# The sim's transcendental functions (`math::det`): a pure-Rust port of musl's libm, so every
# platform's lockstep peers compute the same bits (the platform libm differs across macOS, Windows
# and Linux, and across CPU feature paths).
libm = "0.2"

[[example]]
# The headless viewmodel sweep (docs/TESTING.md): it draws through the wgpu renderer.
name = "render_viewmodels"
required-features = ["renderer"]

[[example]]
# The headless third-person sweep (docs/TESTING.md): the overhead General's weapon, natively.
name = "render_world_weapons"
required-features = ["renderer"]

[dev-dependencies]
zhbo-assets = { path = "../zhbo-assets" }
zhbo-formats = { path = "../zhbo-formats" }
png = "0.17"
