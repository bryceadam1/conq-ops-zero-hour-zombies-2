[workspace]
resolver = "2"
members = ["crates/zhbo-core", "crates/zhbo-formats", "crates/zhbo-requirements", "crates/zhbo-launcher", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/bryceadam1/conq-ops-zero-hour"

[profile.release]
# The core is linked into the game executable; unwinding across the C++ boundary is UB.
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
